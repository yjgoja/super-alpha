# Super Alpha always-on trading engine (PC 불필요; MetaAPI 한도 회피 간격)
# Deploy: push to GitHub → Render Blueprint / `render services create`
# Cost: Background Worker Starter ≈ $7/mo (always-on; Free tier 없음)
services:
  - type: worker
    name: super-alpha-engine
    runtime: docker
    dockerfilePath: ./Dockerfile.engine
    repo: https://github.com/yjgoja/super-alpha
    plan: starter
    region: ohio
    branch: master
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: super-alpha-db
          property: connectionString
      - key: METAAPI_TOKEN
        sync: false
      - key: ENGINE_MODE
        value: direct
      - key: ENGINE_INTERVAL_MS
        value: "60000"
      - key: STREAM_OPEN_BASKETS
        value: "1"
      - key: STREAM_OPEN_INTERVAL_MS
        value: "12000"
      - key: STREAM_OPEN_MAX
        value: "20"
      - key: STREAM_OPEN_CONCURRENCY
        value: "2"
      - key: ENGINE_SNAP_STALE_MS
        value: "15000"
      - key: METAAPI_STREAM
        value: "1"
      - key: METAAPI_PRICE_REST
        value: "0"
      - key: METAAPI_PRICE_STREAM_WAIT_MS
        value: "12000"
      - key: ENGINE_CONCURRENCY
        value: "4"
      - key: METAAPI_REGION
        value: "london"
      - key: METAAPI_SNAP_MIN_MS
        value: "10000"
      - key: METAAPI_ACCOUNT_INFO_TTL_MS
        value: "90000"
      - key: METAAPI_PRICE_CACHE_MS
        value: "5000"
      - key: PNL_SYNC_THROTTLE_MS
        value: "180000"
      - key: IDLE_BOT_UNDEPLOY_HOURS
        value: "2"
      - key: BROKER_PROTECT_TP_SL
        value: "1"
      - key: ENGINE_BUDGET_MS
        value: "600000"
      - key: ENGINE_DB_HOST_ALLOW
        value: render.com
      - key: ENGINE_CLOUD_WAIT_MS
        value: "45000"
      - key: NODE_ENV
        value: production

  # Offline logic factory — invent + preset param search + sim/rank + safe promote
  # Separate from trading engine so discovery never blocks live ticks.
  - type: worker
    name: super-alpha-logic-factory
    runtime: docker
    dockerfilePath: ./Dockerfile.engine
    dockerCommand: npx tsx scripts/logic-factory-run.ts --continuous --n 32 --gens 0 --sleep-ms 15000
    repo: https://github.com/yjgoja/super-alpha
    plan: starter
    region: ohio
    branch: master
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: super-alpha-db
          property: connectionString
      - key: METAAPI_TOKEN
        sync: false
      - key: FACTORY_AUTO_PROMOTE
        value: "1"
      - key: FACTORY_PROMOTE_DEMO_ONLY
        value: "0"
      - key: FACTORY_MAX_LOTS
        value: "0.05"
      - key: FACTORY_SYMBOLS
        value: "GBPUSD,EURUSD"
      # Telegram 일일보고: KST 12시 1회만 (세대마다/신규최고 스팸 금지)
      - key: FACTORY_TELEGRAM_DAILY
        value: "1"
      - key: FACTORY_TELEGRAM_HOUR_KST
        value: "12"
      - key: FACTORY_TELEGRAM_ON_NEW_HIGH
        value: "0"
      # Keep 0: continuous worker must not Telegram; GHA noon job sends digest
      - key: FACTORY_TELEGRAM_FROM_WORKER
        value: "0"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: NODE_ENV
        value: production
