# SMOKE TEST ONLY — runs one dry generation to prove the factory pipeline works.
# It never persists and never promotes (no DATABASE_URL secret, and --dry-promote).
# The real unattended factory is the Render worker `super-alpha-logic-factory`
# (see render.yaml + .github/workflows/render-factory-deploy.yml).
name: logic-factory-once

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # This job is a SMOKE TEST, not the factory. secrets.DATABASE_URL is not
      # set, so nothing here can persist an epoch or promote a logic — it only
      # proves the pipeline still compiles and produces a ranked winner.
      # The real factory is the Render worker `super-alpha-logic-factory`,
      # which gets DATABASE_URL from the Blueprint (fromDatabase).
      - name: Note run mode
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL 미설정 — 스모크 테스트로만 실행합니다(저장/승격 없음). 실제 공장은 Render worker super-alpha-logic-factory 입니다."
          else
            echo "DATABASE_URL 있음 — 결과가 DB에 저장됩니다."
          fi
      - name: Run one factory generation (dry)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          FACTORY_MAX_LOTS: "0.05"
          FACTORY_SYMBOLS: "GBPUSD,EURUSD"
        # --dry-promote is deliberate and must stay: a CI runner must never push
        # a freshly invented logic onto live accounts. Promotion belongs to the
        # Render worker, which runs continuously and can gate on open baskets.
        run: npx tsx scripts/logic-factory-run.ts --once --n 24 --stride 20 --dry-promote
