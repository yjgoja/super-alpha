# 거래시간(월~금) 엔진 자동 시작
# 월요일 아침 9시(UTC+9) → 엔진 시작
name: Market Open - Engine Start

on:
  schedule:
    # 월요일 09:00 KST (UTC 00:00) → 엔진 시작
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  start-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Start Render engine for market open
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d9fhtaernols73c0l8k0
        run: |
          echo "📈 거래시간 엔진 시작"
          if [ -z "$RENDER_API_KEY" ]; then
            echo "⚠️ RENDER_API_KEY 없음 — 수동으로 Render에서 시작하세요"
            exit 0
          fi

          # Render API를 통한 엔진 시작
          curl -X POST https://api.render.com/v1/services/$RENDER_SERVICE_ID/resume \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            && echo "✅ 엔진 시작 완료" || echo "❌ 시작 실패"

      - name: Restore Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "🔔 텔레그램 알림 복구"
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" >> .env.local
          echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env.local
          echo "✅ 알림 복구 설정 완료"
